syntax = "proto3";

package benchmark.v1;

option go_package = "github.com/Brilhante29/grpc-vs-rest-bench/internal/proto/benchmark/v1";

service BenchmarkService {
  rpc Echo(EchoRequest) returns (EchoResponse);
}

message EchoRequest {
  string request_id = 1;
  string payload = 2;
}

message EchoResponse {
  string request_id = 1;
  string payload = 2;
  string payload_sha256 = 3;
}
