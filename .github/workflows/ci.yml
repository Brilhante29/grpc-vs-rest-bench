name: ci

on:
  push:
    branches: [main, "codex/**", "agent/**"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.5.0
        with:
          go-version: "1.26.5"

      - name: Build
        run: go build ./...

      - name: Format gate
        shell: bash
        run: test -z "$(gofmt -l .)"

      - name: Test with race detector
        run: go test -race -count=1 ./...

      - name: Static analysis
        run: go vet ./...

      - name: Real Docker Compose benchmark smoke
        shell: pwsh
        env:
          BENCHMARK_PRODUCER: github-actions
          BENCHMARK_HARDWARE_CLASS: github-hosted-ubuntu-latest
          BENCHMARK_CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: ./tools/run-benchmark.ps1 -Requests 100 -PayloadBytes 256 -Concurrency 10 -WarmupRequests 20 -Repetitions 3 -ResultsDir (Join-Path $env:RUNNER_TEMP "grpc-vs-rest-bench")

      - name: Portfolio validation
        shell: pwsh
        run: ./tools/validate-project.ps1 -SkipDocker
