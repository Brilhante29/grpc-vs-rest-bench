id: 15
name: grpc-vs-rest-bench
program:
  id: backend-reliability-platform
  narrative_fit: Benchmarks transport protocol overhead (gRPC vs REST) to inform backend service communication decisions
  shared_assets:
    - benchmark-report-schema
    - docker-multistage-go-template
status: published
claim: comparacao REST vs gRPC
stack:
  - go
  - grpc
  - chi
  - protobuf
  - docker
language_profile:
  primary: go-backend
  secondary: []
  reason: Go provides native gRPC support, minimal runtime overhead for benchmarking, and single-binary Docker deployment
decision_brain:
  agentic_spec:
    source: .portfolio/decision-brain/agentic-spec-governance.yaml
    spec_store: portfolio-reuse-kit
    schema: portfolio-system
    project_config: openspec/config.yaml
    component_pack: backend-reliability-platform
    artifact_graph:
      - intent->portfolio-impact->architecture-record
      - architecture-record+portfolio-impact->component-pack
      - component-pack->reuse-delta->benchmark-proof->tasks->verification
  agent_graph:
    mode: principal-agent-orchestrated
    source: .portfolio/decision-brain/agent-graph.yaml
    handoff: sdd/agent-handoff.md
    local_first_runtime: docker+kumo-when-cloud-behavior-is-needed
  reuse_improvement_loop:
    source: .portfolio/decision-brain/reuse-improvement-loop.yaml
    review_path: sdd/reuse-improvement-review.md
    current_status: complete
  principles:
    coupling_rule: domain/use cases do not depend on framework, database, broker, cloud SDK, transport, or UI
    solid: [srp, ocp, lsp, isp, dip]
    simplicity_rule: Single Echo RPC; no DB, no auth, no streaming â€” minimal surface for transport comparison
    testability_rule: EchoLogic is pure Go struct, testable without gRPC/HTTP transport
    rejected_overengineering:
      - streaming RPCs
      - authentication middleware
      - database persistence
      - structured logging library
  stack_profile: go-backend
  api_style: rest-http+grpc
  messaging: none
  cloud:
    mode: none
    local_provider: kumo
    real_provider_target: none
    emulated_services: []
    adapter_rule: ports/adapters keep cloud SDK outside domain/use cases
    config_switch: CLOUD_PROVIDER=none
    unsupported_behaviors: []
  database: none
  runtime: docker-container
  library_policy: Minimal deps â€” chi for REST routing, grpc+protobuf for gRPC, stdlib for everything else
  record_path: sdd/technical-decision.md
  rejected_options:
    - option: fiber (REST framework)
      reason: chi is more idiomatic Go; fiber adds unnecessary abstraction for a benchmark
    - option: connect-go
      reason: gRPC-native protobuf serialization is the benchmark subject; connect-go adds HTTP framing
architecture:
  style: modular-monolith
  reason: Two servers (REST + gRPC) sharing identical EchoLogic; no reason to split into services
  problem_forces:
    domain_complexity: low
    integration_pressure: low
    ui_state_complexity: none
    data_or_ml_reproducibility: low
    auditability: low
    throughput_or_async: medium
    independent_deployability: low
  dependency_rule: cmd/ depends on internal/ but internal/ must not import cmd/
  boundaries:
    - cmd/grpc-server: gRPC transport adapter
    - cmd/rest-server: REST/HTTP transport adapter
    - cmd/bench-client: benchmark harness entrypoint
    - internal/: shared domain logic
    - internal/benchmark/: benchmark suite + report
  rejected_alternatives:
    - style: microservices
      reason: Two-server architecture is already modular; microservices add orchestration overhead without benchmark benefit
design_system:
  tokens: design-system/tokens.yaml
  readme_components:
    - readme_header
    - benchmark_card
    - architecture_card
    - references_table
  diagram_required: true
reuse:
  kit_version: local
  uses:
    - catalog
    - programs
    - proficiency-map
    - component-packs
    - openspec-schema
    - decision-brain
    - agent-graph
    - reuse-improvement-loop
    - architecture
    - language-profiles
    - design-system
    - sdd
    - harness
    - templates
    - skills
benchmark:
  primary_metric: latency_ms_by_protocol
  unit: milliseconds
  command: docker run --rm grpc-vs-rest-bench
  result_path: benchmarks/results/*.json
release:
  docker: implemented
  no_secret_default_path: true
  readme_has_number: true
  references_documented: true
